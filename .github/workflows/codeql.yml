name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "31 5 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # build-mode: none extracts Kotlin/Java source directly — no Gradle/Android
      # build required. The previous build-traced setup failed intermittently with
      # "no source code seen during build": on no-op-build commits (e.g. docs-only)
      # the Gradle build cache made `assembleDebug` a cache hit, so nothing
      # recompiled and CodeQL's tracer captured no code (exit 32 at finalize).
      # Source-only extraction removes that fragility entirely.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
